<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Set-demo (mute) — preview</title>
  <style>
    html, body { height: 100%; margin: 0; }
    body {
      font-family: 'Segoe UI', Arial, sans-serif; color: #789;
      background: radial-gradient(1000px 500px at 20% -10%, #203040 0%, transparent 60%), #101112;
    }
    .hint { padding: 28px 40px; }
    .hint h3 { color: #cfe3f5; margin: 0 0 6px; }
    kbd { background: #2b2b2b; border: 1px solid #3a3a3a; border-radius: 6px; padding: 1px 7px; color: #fff; }
    #mute-indicator { margin-top: 20px; font-size: 32px; font-weight: 700; color: #7fd7d6; }
  </style>
</head>
<body>
  <div class="hint">
    <h3>Set-demo — state change (mute toggle)</h3>
    <p>Stubbed <code>RpcSoundSysMute()</code>. On the TV this changes the real system mute.</p>
    <p>Press <kbd>m</kbd> to toggle (or the BLUE button on a real remote).</p>
    <div id="mute-indicator">Speaker: ON</div>
  </div>

  <script>
    window.S = {
      handlers: [],
      onkeydown: function (f) { this.handlers.push(f); },
      fire: function (name) { var r = false; this.handlers.forEach(function (h) { if (h(name)) r = true; }); return r; }
    };
    window.VK_BLUE = 'VK_BLUE';
  </script>
  <script src="rpc-stubs-setdemo.js"></script>
  <script src="../inject-setdemo.js"></script>
</body>
</html>
